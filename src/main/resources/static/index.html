<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Система учёта кадров</title>
</head>
<body>
<h1>Система учёта кадров</h1>
<hr>

<!-- Кнопки перехода на другие страницы -->
<h3>Навигация:</h3>
<ul>
    <li><a href="/page-employees.html">Все записи из Employee</a></li>
</ul>

<hr>

<!-- Блок со списком сотрудников -->
<h3>Акутальные записи из Employee</h3>

<!-- Таблица, куда будут вставляться данные -->
<table id="employeesTable" border="1" style="display: none;">
    <thead>
    <tr>
        <th>ID</th>
        <th>ФИО</th>
        <th>Статус</th>
        <th>Дата добавления записи</th>
    </tr>
    </thead>
    <tbody id="tableBody">
    <!-- Сюда JS вставит строки -->
    </tbody>
</table>

<!-- Сообщение, если список пуст -->
<div id="emptyMessage" style="display: none;">
    <p>Сотрудников пока нет.</p>
</div>

<script>
    // При загрузке страницы сразу вызываем функцию
    window.onload = function() {
        loadEmployees();
    };

    async function loadEmployees() {
        try {
            // 1. Стучимся в Gateway (8080)
            // Используем /actual, чтобы вывести только актуальные записи (без старых версий)
            const response = await fetch('http://localhost:8080/api/employees/actual');

            if (!response.ok) {
                throw new Error('Ошибка сервера: ' + response.status);
            }

            const employees = await response.json();

            const table = document.getElementById('employeesTable');
            const tbody = document.getElementById('tableBody');
            const emptyMessage = document.getElementById('emptyMessage');

            tbody.innerHTML = ''; // Очищаем перед заполнением

            if (employees.length === 0) {
                table.style.display = 'none';
                emptyMessage.style.display = 'block';
                return;
            }

            table.style.display = 'table';
            emptyMessage.style.display = 'none';

            employees.forEach(emp => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${emp.employeeId}</td>
                    <td>${emp.fullName}</td>
                    <td>${emp.workStatus}</td>
                    <td>${emp.addDate}</td>
                `;
                tbody.appendChild(row);
            });

        } catch (error) {
            console.error("Ошибка:", error);
            // Если Gateway не запущен или сервис упал
            document.getElementById('emptyMessage').innerHTML =
                "<p style='color:red;'>Ошибка загрузки данных. Проверьте, запущены ли Gateway (8080) и Кадровая база (8081).</p>";
            document.getElementById('emptyMessage').style.display = 'block';
        }
    }
</script>
</body>
</html>
